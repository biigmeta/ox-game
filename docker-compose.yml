services:
  db:
    image: postgres:15
    container_name: ox_game_db
    env_file:
      - .env
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: app-api
    restart: always
    env_file:
      - ./api/.env
    ports:
      - "3000:3000"
    depends_on:
      - db

  app:
    container_name: ox_game_app
    build:
      context: ./web-app
      dockerfile: Dockerfile
    env_file:
      - ./web-app/.env
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  pgdata: